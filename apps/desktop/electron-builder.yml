appId: com.inventory.desktop
productName: Inventory
directories:
  output: release
files:
  - out/**
  - package.json
  - "!**/better-sqlite3-multiple-ciphers/{build,deps,src,benchmark}/**"
  - "!**/better-sqlite3-multiple-ciphers/prebuilds/{darwin,linux}*"
  - "!**/better-sqlite3-multiple-ciphers/prebuilds/win32-arm64.node"
asarUnpack:
  - "**/better-sqlite3-multiple-ciphers/prebuilds/*.node"
# The module is Node-API, so one prebuilt binary serves both Node and Electron.
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
