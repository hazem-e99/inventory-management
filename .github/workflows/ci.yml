name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Windows is the shipping platform, so native loading and Electron are checked there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm audit --prod
